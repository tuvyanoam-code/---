<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול החתונה · Wedding admin</title>
<meta name="theme-color" content="#f7ecdc">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Bellefair&family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;1,400&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="config.js"></script>
<script>
  /* Theme and language before anything paints. */
  (function () {
    var d = document.documentElement, l = '';
    try { var t = localStorage.getItem('wedding-admin-theme'); if (t) d.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
    try { l = new URLSearchParams(location.search).get('lang') || ''; } catch (e) {}
    if (l !== 'he' && l !== 'en') { try { l = JSON.parse(localStorage.getItem('wedding-lang')) || ''; } catch (e) {} }
    if (l !== 'he' && l !== 'en') l = (window.WEDDING && window.WEDDING.defaultLang) || 'he';
    d.lang = l;
    d.dir = l === 'en' ? 'ltr' : 'rtl';
    d.classList.add('i18n-pending');
    setTimeout(function () { d.classList.remove('i18n-pending'); }, 3000);
  })();
</script>
<script src="invitation/pages.js" onerror="window.INVITATION_PAGES=null"></script>
<script src="js/i18n.js" defer></script>
<script src="js/util.js" defer></script>
<script src="js/api.js" defer></script>
<script src="vendor/qrcode.js" defer></script>
<script src="js/charts.js" defer></script>
<script src="js/admin.js" defer></script>
</head>
<body class="admin">

<!-- ============ login ============ -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="login-mark" aria-hidden="true"></div>
    <h1 data-i18n="a.title"></h1>
    <p class="muted" id="loginCouple"></p>
    <label class="field">
      <span data-i18n="a.password"></span>
      <input class="input" type="password" id="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn" data-i18n="a.login"></button>
    <p class="form-error" id="loginError" role="alert" hidden></p>
    <button class="btn btn-ghost btn-sm lang-btn" type="button" data-lang-toggle></button>
  </form>
</div>

<!-- ============ app ============ -->
<div class="shell" id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <b id="brandCouple"></b>
        <small id="brandSub"></small>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" data-i18n-aria="a.screens"></nav>
    <div class="top-actions">
      <span class="updated" id="updated" aria-live="polite"></span>
      <button class="btn btn-ghost btn-icon btn-sm" type="button" id="refreshBtn" data-i18n-title="a.refresh" data-i18n-aria="a.refresh"></button>
      <a class="btn btn-ghost btn-icon btn-sm" id="sheetBtn" target="_blank" rel="noopener" data-i18n-title="a.sheet" data-i18n-aria="a.sheet" hidden></a>
      <a class="btn btn-ghost btn-icon btn-sm" id="siteBtn" href="./" target="_blank" rel="noopener" data-i18n-title="a.site" data-i18n-aria="a.site"></a>
      <button class="btn btn-ghost btn-icon btn-sm" type="button" id="themeBtn" data-i18n-title="a.theme" data-i18n-aria="a.theme"></button>
      <button class="btn btn-ghost btn-sm lang-btn" type="button" data-lang-toggle></button>
      <button class="btn btn-ghost btn-icon btn-sm" type="button" id="logoutBtn" data-i18n-title="a.logout" data-i18n-aria="a.logout" hidden></button>
    </div>
  </header>

  <div class="demo-banner" id="demoBanner" hidden>
    <p><b data-i18n="a.demoB"></b> <span data-i18n="a.demo"></span></p>
    <div class="demo-actions">
      <button class="btn btn-sm" type="button" id="seedBtn" data-i18n="a.seed"></button>
      <button class="btn btn-sm btn-ghost" type="button" id="resetBtn" data-i18n="a.reset"></button>
    </div>
  </div>

  <main class="main">

    <!-- overview -->
    <section class="view" data-view="overview" aria-labelledby="t-overview">
      <h1 class="sr-only" id="t-overview" data-i18n="a.t.overview"></h1>
      <div class="ov-top">
        <article class="card hero-card">
          <p class="eyebrow" data-i18n="a.confirmed"></p>
          <p class="hero-num"><span id="heroNum">0</span><small id="heroUnit"></small></p>
          <p class="hero-sub" id="heroSub"></p>
          <div class="meter" id="heroMeter" hidden><span></span></div>
        </article>
        <div class="tiles" id="tiles"></div>
      </div>

      <div class="grid-2">
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cReplies"></h2><p class="muted" id="segNote"></p></header>
          <div id="segChart"></div>
        </article>
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cFunnel"></h2><p class="muted" data-i18n="a.cFunnelSub"></p></header>
          <div id="funnelChart"></div>
        </article>
      </div>

      <div class="grid-2">
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cLine"></h2><p class="muted" data-i18n="a.cLineSub"></p></header>
          <div id="lineChart" class="chart-box"></div>
        </article>
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cCols"></h2><p class="muted" data-i18n="a.cColsSub"></p></header>
          <div id="colChart" class="chart-box"></div>
        </article>
      </div>

      <div class="grid-3">
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cSrc"></h2><p class="muted" data-i18n="a.cSrcSub"></p></header>
          <div id="srcChart"></div>
          <p class="muted small" id="deviceNote"></p>
        </article>
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cSides"></h2><p class="muted" data-i18n="a.cSidesSub"></p></header>
          <div id="sidesBox"></div>
        </article>
        <article class="card">
          <header class="card-head"><h2 data-i18n="a.cNotes"></h2></header>
          <ul class="notes" id="notesBox"></ul>
        </article>
      </div>

      <article class="card">
        <header class="card-head row">
          <h2 data-i18n="a.cFeed"></h2>
          <button class="btn btn-sm btn-ghost" type="button" data-goto="activity" data-i18n="a.allActivity"></button>
        </header>
        <ul class="feed" id="recentFeed"></ul>
      </article>
    </section>

    <!-- rsvps -->
    <section class="view" data-view="rsvps" aria-labelledby="t-rsvps" hidden>
      <div class="view-head">
        <h1 id="t-rsvps" data-i18n="a.rsvpsTitle"></h1>
        <div class="view-actions">
          <button class="btn btn-sm" type="button" id="addRsvpBtn"></button>
          <button class="btn btn-sm" type="button" id="exportRsvpBtn"></button>
          <button class="btn btn-sm" type="button" id="printBtn"></button>
        </div>
      </div>
      <div class="toolbar">
        <label class="search"><span class="sr-only" data-i18n="a.search"></span><input class="input" type="search" id="rsvpSearch" data-i18n-ph="a.searchRsvp"></label>
        <div class="chips" id="rsvpChips" role="group" data-i18n-aria="a.filterReply"></div>
        <label class="sort"><span class="sr-only" data-i18n="a.sort"></span>
          <select class="input" id="rsvpSort">
            <option value="updated" data-i18n="a.sortNew"></option>
            <option value="name" data-i18n="a.sortName"></option>
            <option value="count" data-i18n="a.sortCount"></option>
          </select>
        </label>
      </div>
      <div class="card table-card">
        <table class="table" id="rsvpTable">
          <thead><tr><th data-i18n="a.th.name"></th><th data-i18n="a.th.reply"></th><th class="num" data-i18n="a.th.guests"></th><th data-i18n="a.th.phone"></th><th data-i18n="a.th.note"></th><th data-i18n="a.th.src"></th><th data-i18n="a.th.updated"></th><th><span class="sr-only" data-i18n="a.th.actions"></span></th></tr></thead>
          <tbody></tbody>
        </table>
        <p class="empty" id="rsvpEmpty" hidden></p>
      </div>
      <p class="table-total" id="rsvpTotal"></p>
    </section>

    <!-- guests -->
    <section class="view" data-view="guests" aria-labelledby="t-guests" hidden>
      <div class="view-head">
        <h1 id="t-guests" data-i18n="a.guestsTitle"></h1>
        <div class="view-actions">
          <button class="btn btn-sm btn-primary" type="button" id="sendQueueBtn"></button>
          <button class="btn btn-sm" type="button" id="addGuestBtn"></button>
          <button class="btn btn-sm" type="button" id="importBtn"></button>
          <button class="btn btn-sm" type="button" id="exportGuestsBtn"></button>
        </div>
      </div>
      <div class="pipeline" id="pipeline"></div>
      <div class="toolbar">
        <label class="search"><span class="sr-only" data-i18n="a.search"></span><input class="input" type="search" id="guestSearch" data-i18n-ph="a.searchGuest"></label>
        <label class="sort"><span class="sr-only" data-i18n="a.th.side"></span><select class="input" id="sideFilter"></select></label>
      </div>
      <div class="card table-card">
        <table class="table" id="guestTable">
          <thead><tr><th data-i18n="a.th.name"></th><th data-i18n="a.th.state"></th><th data-i18n="a.th.phone"></th><th data-i18n="a.th.side"></th><th class="num" data-i18n="a.th.invited"></th><th data-i18n="a.th.send"></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="guestEmpty" hidden></div>
      </div>
      <p class="table-total" id="guestTotal"></p>
    </section>

    <!-- share -->
    <section class="view" data-view="share" aria-labelledby="t-share" hidden>
      <div class="view-head"><h1 id="t-share" data-i18n="a.shareTitle"></h1></div>
      <div class="grid-2 share-grid">
        <div class="stack">
          <article class="card">
            <header class="card-head"><h2 data-i18n="a.linkCard"></h2><p class="muted" data-i18n="a.linkCardSub"></p></header>
            <div class="field">
              <span data-i18n="a.msgLang"></span>
              <div class="seg-control seg-2" id="shareLang" role="radiogroup">
                <label><input type="radio" name="shareLang" value="he"><span data-i18n="lang.he" lang="he"></span></label>
                <label><input type="radio" name="shareLang" value="en"><span data-i18n="lang.en" lang="en"></span></label>
              </div>
            </div>
            <div class="linkbox">
              <code id="shareLink" dir="ltr"></code>
              <button class="btn btn-sm" type="button" id="copyLinkBtn"></button>
            </div>
            <label class="field">
              <span data-i18n="a.msg"></span>
              <textarea class="input" id="shareMsg" rows="5"></textarea>
            </label>
            <p class="muted small" data-i18n="a.msgHelp"></p>
            <div class="share-btns" id="shareBtns"></div>
            <button class="btn btn-sm btn-ghost" type="button" id="resetMsgBtn" data-i18n="a.resetMsg"></button>
          </article>
          <article class="card">
            <header class="card-head"><h2 data-i18n="a.personalCard"></h2></header>
            <p class="muted" data-i18n="a.personalText"></p>
            <div class="row-actions start"><button class="btn btn-sm" type="button" data-goto="guests" data-i18n="a.toGuests"></button></div>
          </article>
        </div>
        <div class="stack">
          <article class="card">
            <header class="card-head"><h2 data-i18n="a.waPreview"></h2></header>
            <div class="wa-preview">
              <div class="wa-bubble" id="waBubble">
                <div class="wa-card">
                  <img id="ogImg" alt="" loading="lazy">
                  <div class="wa-meta"><b id="ogTitle"></b><span id="ogDesc"></span><small dir="ltr" id="ogHost"></small></div>
                </div>
                <p class="wa-text" id="waText"></p>
              </div>
            </div>
          </article>
          <article class="card qr-card">
            <header class="card-head"><h2 data-i18n="a.qr"></h2><p class="muted" data-i18n="a.qrSub"></p></header>
            <div class="qr" id="qrBox"></div>
            <div class="row-actions">
              <button class="btn btn-sm" type="button" id="qrDownload"></button>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- activity -->
    <section class="view" data-view="activity" aria-labelledby="t-activity" hidden>
      <div class="view-head">
        <h1 id="t-activity" data-i18n="a.activityTitle"></h1>
        <div class="view-actions"><button class="btn btn-sm" type="button" id="exportEventsBtn"></button></div>
      </div>
      <div class="toolbar">
        <label class="sort"><span class="sr-only" data-i18n="a.eventType"></span><select class="input" id="eventFilter"></select></label>
      </div>
      <article class="card">
        <ul class="feed" id="activityFeed"></ul>
        <button class="btn btn-sm btn-block more-btn" type="button" id="moreEvents" data-i18n="a.more" hidden></button>
      </article>
    </section>
  </main>

  <nav class="bottom-tabs" id="bottomTabs" data-i18n-aria="a.screens"></nav>
</div>

<!-- ============ dialogs ============ -->
<dialog class="dialog" id="rsvpDialog">
  <form method="dialog" class="dialog-body" id="rsvpEditForm">
    <h2 id="rsvpDialogTitle"></h2>
    <label class="field"><span data-i18n="a.f.name"></span><input class="input" name="name" required maxlength="80"></label>
    <div class="field"><span data-i18n="a.f.reply"></span>
      <div class="seg-control">
        <label><input type="radio" name="status" value="yes" checked><span data-i18n="a.s.yes"></span></label>
        <label><input type="radio" name="status" value="maybe"><span data-i18n="a.s.maybe"></span></label>
        <label><input type="radio" name="status" value="no"><span data-i18n="a.s.no"></span></label>
      </div>
    </div>
    <label class="field"><span data-i18n="a.f.count"></span><input class="input" name="count" type="number" min="1" max="50" value="2" inputmode="numeric"></label>
    <label class="field"><span data-i18n="a.f.phone"></span><input class="input" name="phone" type="tel" dir="ltr" maxlength="30"></label>
    <label class="field"><span data-i18n="a.f.note"></span><textarea class="input" name="note" maxlength="600"></textarea></label>
    <div class="dialog-actions">
      <button class="btn btn-primary" value="save" type="submit" data-i18n="a.saveBtn"></button>
      <button class="btn btn-ghost" value="cancel" type="button" data-close data-i18n="a.cancel"></button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="guestDialog">
  <form method="dialog" class="dialog-body" id="guestEditForm">
    <h2 id="guestDialogTitle"></h2>
    <label class="field"><span data-i18n="a.f.gname"></span><input class="input" name="name" required maxlength="80" data-i18n-ph="a.f.gnamePh"></label>
    <label class="field"><span data-i18n="a.f.phone"></span><input class="input" name="phone" type="tel" dir="ltr" maxlength="30" placeholder="050-0000000"></label>
    <div class="field-row">
      <label class="field"><span data-i18n="a.f.side"></span><select class="input" name="side"></select></label>
      <label class="field"><span data-i18n="a.f.invited"></span><input class="input" name="invited" type="number" min="0" max="50" value="2" inputmode="numeric"></label>
    </div>
    <div class="field"><span data-i18n="a.f.lang"></span>
      <div class="seg-control seg-2">
        <label><input type="radio" name="lang" value="he" checked><span data-i18n="lang.he" lang="he"></span></label>
        <label><input type="radio" name="lang" value="en"><span data-i18n="lang.en" lang="en"></span></label>
      </div>
    </div>
    <label class="field"><span data-i18n="a.f.notes"></span><input class="input" name="notes" maxlength="300"></label>
    <div class="dialog-actions">
      <button class="btn btn-primary" value="save" type="submit" data-i18n="a.saveBtn"></button>
      <button class="btn btn-ghost" value="cancel" type="button" data-close data-i18n="a.cancel"></button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="importDialog">
  <form method="dialog" class="dialog-body" id="importForm">
    <h2 data-i18n="a.importTitle"></h2>
    <p class="muted" data-i18n="a.importHelp"></p>
    <textarea class="input mono" id="importText" rows="8" dir="auto" placeholder="משפחת כהן	050-1234567	4&#10;The Smith family, 0527654321, 2, en&#10;דנה"></textarea>
    <label class="btn btn-sm file-btn"><input type="file" id="importFile" accept=".csv,.txt,.tsv,text/csv,text/plain"><span data-i18n="a.importFile"></span></label>
    <p class="import-preview" id="importPreview"></p>
    <div class="dialog-actions">
      <button class="btn btn-primary" value="save" type="submit" id="importGo" data-i18n="a.importGo" disabled></button>
      <button class="btn btn-ghost" value="cancel" type="button" data-close data-i18n="a.cancel"></button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="queueDialog">
  <div class="dialog-body">
    <h2 data-i18n="a.sendQueue"></h2>
    <p class="muted" id="queueInfo"></p>
    <div class="queue-card" id="queueCard"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" data-close data-i18n="a.finish"></button>
    </div>
  </div>
</dialog>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
