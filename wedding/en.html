<body>

<div class="wash" aria-hidden="true"></div>

<main class="page">

  <div class="topline">
    <p class="bsd" data-i18n="g.bsd"></p>
    <button class="lang-toggle" type="button" data-lang-toggle></button>
  </div>
  <p class="greeting" id="greeting" hidden></p>

  <!-- The invitation itself is the page: no retyped copy of it. -->
  <section class="invitation" aria-labelledby="pageTitle">
    <h1 class="sr-only" id="pageTitle"></h1>
    <div class="book" id="book" tabindex="0" role="group"></div>
    <div class="book-nav" id="bookNav" hidden>
      <button class="nav-btn" type="button" id="prevPage"></button>
      <span class="dots" id="dots" aria-hidden="true"></span>
      <span class="sr-only" id="pageStatus" aria-live="polite"></span>
      <button class="nav-btn" type="button" id="nextPage"></button>
    </div>
    <p class="book-hint" id="bookHint"></p>
    <div class="invite-actions">
      <a class="btn btn-sm btn-ghost" id="downloadPdf" download></a>
    </div>
  </section>

  <section class="rsvp" id="rsvp" aria-labelledby="rsvpTitle">
    <div class="rsvp-card">
      <div class="rsvp-head">
        <h2 id="rsvpTitle" data-i18n="g.rsvpTitle"></h2>
        <p class="rsvp-sub" id="rsvpSub"></p>
      </div>

      <form id="rsvpForm" novalidate>
        <fieldset class="choices">
          <legend class="sr-only" data-i18n="g.question"></legend>
          <label class="choice c-yes">
            <input type="radio" name="status" value="yes">
            <span class="choice-ico"></span>
            <span class="choice-label" data-i18n="g.yes"></span>
          </label>
          <label class="choice c-maybe">
            <input type="radio" name="status" value="maybe">
            <span class="choice-ico"></span>
            <span class="choice-label" data-i18n="g.maybe"></span>
          </label>
          <label class="choice c-no">
            <input type="radio" name="status" value="no">
            <span class="choice-ico"></span>
            <span class="choice-label" data-i18n="g.no"></span>
          </label>
        </fieldset>

        <div class="rsvp-fields" id="rsvpFields">
          <label class="field">
            <span data-i18n="g.name"></span>
            <input class="input" name="name" id="name" autocomplete="name" data-i18n-ph="g.namePh" maxlength="80" required>
          </label>

          <div class="field" id="countField">
            <span id="countLabel" data-i18n="g.howMany"></span>
            <div class="stepper" role="group" aria-labelledby="countLabel">
              <button type="button" class="step" data-step="1" data-i18n-aria="g.addGuest"></button>
              <output class="count" id="count" aria-live="polite">2</output>
              <button type="button" class="step" data-step="-1" data-i18n-aria="g.removeGuest"></button>
            </div>
            <p class="count-words" id="countWords"></p>
          </div>

          <label class="field" id="phoneField">
            <span><span data-i18n="g.phone"></span> <em class="opt" data-i18n="g.optional"></em></span>
            <input class="input" name="phone" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-0000000" maxlength="30" dir="ltr">
          </label>

          <label class="field" id="noteField">
            <span><span data-i18n="g.note"></span> <em class="opt" data-i18n="g.optional"></em></span>
            <textarea class="input" name="note" id="note" maxlength="600" data-i18n-ph="g.notePh"></textarea>
          </label>

          <button class="btn btn-primary btn-block submit" type="submit" id="submitBtn"></button>
          <p class="form-error" id="formError" role="alert" hidden></p>
        </div>
      </form>

      <div class="thanks" id="thanks" hidden tabindex="-1">
        <div class="thanks-badge" id="thanksBadge"></div>
        <h3 id="thanksTitle"></h3>
        <p id="thanksText"></p>
        <div class="thanks-actions">
          <button class="btn btn-sm" type="button" id="editRsvp"></button>
          <a class="btn btn-sm" id="thanksCalendar" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="practical" data-i18n-aria="g.practical">
    <div class="practical-row" id="practical"></div>
  </section>

  <section class="share" aria-labelledby="shareTitle">
    <h2 class="section-title" id="shareTitle"><span data-i18n="g.shareTitle"></span></h2>
    <div class="share-row" id="shareRow"></div>
  </section>

</main>

<a class="float-cta" id="floatCta" href="#rsvp" hidden data-i18n="g.cta"></a>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="inviteTitle" hidden>
  <div class="viewer-bar">
    <button class="vbtn" type="button" id="vClose" data-i18n-aria="g.close"></button>
    <span class="viewer-pages" id="vPages"></span>
    <div class="viewer-tools">
      <button class="vbtn" type="button" id="vZoomOut" data-i18n-aria="g.zoomOut"></button>
      <button class="vbtn" type="button" id="vZoomIn" data-i18n-aria="g.zoomIn"></button>
      <a class="vbtn" id="vDownload" data-i18n-aria="g.download" download></a>
      <button class="vbtn" type="button" id="vShare" data-i18n-aria="g.share"></button>
    </div>
  </div>
  <div class="viewer-scroll" id="vScroll">
    <div class="viewer-pages-wrap" id="vWrap"></div>
  </div>
</div>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
</body>
