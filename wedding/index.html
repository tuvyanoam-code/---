<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:locale" content="he_IL">
<meta property="og:title" content="נועה &amp; איתי מתחתנים!">
<meta property="og:description" content="יום חמישי, 17 ביוני 2027 · גן האירועים. לחצו לצפייה בהזמנה ולאישור הגעה">

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff8f0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500;600;700&family=Suez+One&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/guest.css">
<script src="config.js"></script>
<script src="invitation/pages.js" onerror="window.INVITATION_PAGES=null"></script>
<script src="js/util.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/guest.js" defer></script>
</head>
<body>

<div class="bg-shapes" aria-hidden="true">
  <span class="shape s-sun"></span>
  <span class="shape s-mint"></span>
  <span class="shape s-lilac"></span>
  <svg class="shape s-squiggle" viewBox="0 0 120 30"><path d="M3 15c10-14 20-14 28 0s18 14 28 0 20-14 28 0 18 14 30 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
  <svg class="shape s-star" viewBox="0 0 40 40"><path d="M20 2c1.6 10.4 7.6 16.4 18 18-10.4 1.6-16.4 7.6-18 18-1.6-10.4-7.6-16.4-18-18C12.4 18.4 18.4 12.4 20 2Z" fill="currentColor"/></svg>
  <svg class="shape s-star2" viewBox="0 0 40 40"><path d="M20 2c1.6 10.4 7.6 16.4 18 18-10.4 1.6-16.4 7.6-18 18-1.6-10.4-7.6-16.4-18-18C12.4 18.4 18.4 12.4 20 2Z" fill="currentColor"/></svg>
</div>

<main class="page">

  <header class="hero">
    <p class="greeting" id="greeting" hidden></p>
    <p class="sticker">מתחתנים!</p>
    <h1 class="names" id="names">
      <span class="name" data-i="0"></span>
      <span class="amp" aria-label="ו">&amp;</span>
      <span class="name" data-i="1"></span>
    </h1>
    <div class="when">
      <p class="date" id="date"></p>
      <p class="hdate" id="hdate"></p>
    </div>
    <p class="countdown" id="countdown" hidden></p>
    <a class="hero-cta btn btn-primary" href="#rsvp" id="heroCta">אישור הגעה</a>
  </header>

  <section class="invite" aria-labelledby="inviteTitle">
    <h2 class="section-title" id="inviteTitle"><span>ההזמנה</span></h2>
    <button class="invite-card" id="inviteCard" type="button" aria-label="פתיחת ההזמנה במסך מלא">
      <span class="tape tape-a" aria-hidden="true"></span>
      <span class="tape tape-b" aria-hidden="true"></span>
      <span class="invite-frame">
        <img id="invitePreview" alt="ההזמנה לחתונה" decoding="async">
        <span class="invite-placeholder" id="invitePlaceholder">
          <span class="ph-mark"></span>
          <span>ההזמנה נטענת…</span>
        </span>
      </span>
      <span class="invite-hint" aria-hidden="true">לחצו להגדלה</span>
    </button>
    <div class="invite-actions">
      <button class="btn" type="button" id="openViewer"></button>
      <a class="btn" id="downloadPdf" download></a>
    </div>
  </section>

  <section class="rsvp" id="rsvp" aria-labelledby="rsvpTitle">
    <div class="rsvp-card">
      <div class="rsvp-head">
        <h2 id="rsvpTitle">אישור הגעה</h2>
        <p class="rsvp-sub" id="rsvpSub"></p>
      </div>

      <form id="rsvpForm" novalidate>
        <fieldset class="choices">
          <legend class="sr-only">האם תגיעו?</legend>
          <label class="choice c-yes">
            <input type="radio" name="status" value="yes">
            <span class="choice-ico"></span>
            <span class="choice-label">מגיעים!</span>
          </label>
          <label class="choice c-maybe">
            <input type="radio" name="status" value="maybe">
            <span class="choice-ico"></span>
            <span class="choice-label">עוד לא בטוח</span>
          </label>
          <label class="choice c-no">
            <input type="radio" name="status" value="no">
            <span class="choice-ico"></span>
            <span class="choice-label">לא נוכל</span>
          </label>
        </fieldset>

        <div class="rsvp-fields" id="rsvpFields">
          <label class="field">
            <span>שם מלא</span>
            <input class="input" name="name" id="name" autocomplete="name" placeholder="איך לרשום אתכם?" maxlength="80" required>
          </label>

          <div class="field" id="countField">
            <span id="countLabel">כמה תגיעו?</span>
            <div class="stepper" role="group" aria-labelledby="countLabel">
              <button type="button" class="step" data-step="1" aria-label="להוסיף אורח"></button>
              <output class="count" id="count" aria-live="polite">2</output>
              <button type="button" class="step" data-step="-1" aria-label="להוריד אורח"></button>
            </div>
            <p class="count-words" id="countWords"></p>
          </div>

          <label class="field" id="phoneField">
            <span>טלפון <em class="opt">(לא חובה)</em></span>
            <input class="input" name="phone" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-0000000" maxlength="30" dir="ltr">
          </label>

          <label class="field" id="noteField">
            <span>ברכה לזוג או הערה <em class="opt">(לא חובה)</em></span>
            <textarea class="input" name="note" id="note" maxlength="600" placeholder="מזל טוב! / טבעוני / מגיעים עם תינוק…"></textarea>
          </label>

          <button class="btn btn-primary btn-block submit" type="submit" id="submitBtn">שליחה</button>
          <p class="form-error" id="formError" role="alert" hidden></p>
        </div>
      </form>

      <div class="thanks" id="thanks" hidden tabindex="-1">
        <div class="thanks-badge" id="thanksBadge"></div>
        <h3 id="thanksTitle"></h3>
        <p id="thanksText"></p>
        <div class="thanks-actions">
          <button class="btn btn-sm" type="button" id="editRsvp"></button>
          <a class="btn btn-sm" id="thanksCalendar" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="details" aria-labelledby="detailsTitle">
    <h2 class="section-title" id="detailsTitle"><span>איפה ומתי</span></h2>
    <div class="detail-grid">
      <div class="detail-card">
        <div class="detail-ico ico-sun" aria-hidden="true"></div>
        <h3 id="dDate"></h3>
        <ul class="schedule" id="schedule"></ul>
        <div class="row-actions" id="calActions"></div>
      </div>
      <div class="detail-card">
        <div class="detail-ico ico-mint" aria-hidden="true"></div>
        <h3 id="dVenue"></h3>
        <p class="address" id="dAddress"></p>
        <div class="row-actions">
          <a class="btn btn-sm" id="waze" target="_blank" rel="noopener"></a>
          <a class="btn btn-sm" id="maps" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="share" aria-labelledby="shareTitle">
    <h2 class="section-title" id="shareTitle"><span>שתפו את ההזמנה</span></h2>
    <div class="share-row" id="shareRow"></div>
  </section>

  <footer class="footer">
    <p class="hand">נתראה ברחבה!</p>
    <p class="sign" id="sign"></p>
  </footer>
</main>

<a class="float-cta" id="floatCta" href="#rsvp" hidden>אישור הגעה</a>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="ההזמנה" hidden>
  <div class="viewer-bar">
    <button class="vbtn" type="button" id="vClose" aria-label="סגירה"></button>
    <span class="viewer-pages" id="vPages"></span>
    <div class="viewer-tools">
      <button class="vbtn" type="button" id="vZoomOut" aria-label="הקטנה"></button>
      <button class="vbtn" type="button" id="vZoomIn" aria-label="הגדלה"></button>
      <a class="vbtn" id="vDownload" aria-label="הורדת PDF" download></a>
      <button class="vbtn" type="button" id="vShare" aria-label="שיתוף"></button>
    </div>
  </div>
  <div class="viewer-scroll" id="vScroll">
    <div class="viewer-pages-wrap" id="vWrap"></div>
  </div>
</div>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
</body>
</html>
