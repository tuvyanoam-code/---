name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign release builds with your own key so updates install over each other.
      # Without these secrets the release APK is signed with a throwaway debug key.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOUNDPILOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SOUNDPILOT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test

      - name: Build APKs
        env:
          SOUNDPILOT_KEYSTORE_PASSWORD: ${{ secrets.SOUNDPILOT_KEYSTORE_PASSWORD }}
          SOUNDPILOT_KEY_ALIAS: ${{ secrets.SOUNDPILOT_KEY_ALIAS }}
          SOUNDPILOT_KEY_PASSWORD: ${{ secrets.SOUNDPILOT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SoundPilot-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            core/build/reports
            app/build/reports
            app/build/outputs/mapping
          if-no-files-found: ignore
